<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Hospital — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script defer src="js/auth.js"></script>

  <style>
    :root{
      --brand:#0b5cff; --brand-dark:#0a49cc;
      --bg-grad-1:#0b3a91; --bg-grad-2:#0b5cff;
      --card:#ffffff; --text:#1c1f23; --muted:#6b7280; --ring:#e5e7eb;
    }
    *{box-sizing:border-box;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--bg-grad-1),var(--bg-grad-2));}
    .container{width:min(420px,92vw);background:var(--card);color:var(--text);border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
    header{text-align:center;margin-bottom:16px}
    header h1{margin:0 0 6px;color:var(--brand);font-size:1.6rem;font-weight:700}
    header p{margin:0;color:var(--muted);font-size:.95rem}

    .tabs{display:flex;gap:8px;background:#f4f6fb;padding:6px;border-radius:12px;margin:18px 0 16px}
    .tab-btn{flex:1;padding:10px 12px;border-radius:10px;border:0;background:transparent;font-weight:600;color:#4b5563;cursor:pointer;}
    .tab-btn.active{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(11,92,255,.18)}

    .view{display:none} .view.active{display:block}
    label{display:block;margin:10px 0 6px;font-weight:600;font-size:.9rem}
    input,select{width:100%;padding:12px;border:1px solid var(--ring);border-radius:10px;font-size:.98rem;outline:0;}
    input:focus,select:focus{border-color:var(--brand)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;}
    .btn:hover{background:var(--brand-dark)}
    .msg{text-align:center;font-size:.9rem;margin-top:8px;min-height:20px}
    .msg.error{color:#dc2626}.msg.success{color:#059669}

    /* Overlay */
    .overlay{position:fixed;inset:0;background:rgba(8,13,29,.92);display:none;align-items:center;justify-content:center;padding:24px;z-index:9999;}
    .chooser{width:min(980px,95vw);color:#e5e7eb;text-align:center;}
    .chooser h2{margin:0 0 6px}
    .chooser p{margin:0 0 18px;color:#9aa3b2}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
    .card{background:linear-gradient(180deg,#10172a,#0b1222);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;cursor:pointer;transition:.18s;box-shadow:0 10px 30px rgba(0,0,0,.35);}
    .card:hover{transform:translateY(-4px);border-color:rgba(11,92,255,.45)}
    .badge{display:inline-flex;gap:6px;background:rgba(11,92,255,.18);color:#cfe0ff;border:1px solid rgba(11,92,255,.35);padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:600;margin-bottom:10px}
    .card h3{margin:4px 0 6px;color:#fff;font-size:1.05rem}
    .card p{margin:0;color:#9aa3b2;font-size:.92rem}
    .overlay-close{margin-top:18px;color:#cfe0ff;cursor:pointer;text-decoration:underline}
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Smart Hospital</h1>
      <p>Secure access for Patients, Doctors, Admins & SuperAdmins</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-view="login">Login</button>
      <button class="tab-btn" data-view="register">Register</button>
    </div>

    
    <!-- LOGIN VIEW -->
    <section id="view-login" class="view active">
      <label for="loginRole">Role</label>
      <select id="loginRole">
        <option value="">Select Role</option>
        <option value="2">Patient</option>
        <option value="1">Doctor</option>
        <option value="0">Admin</option>
        <option value="3">SuperAdmin</option>
      </select>

      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" />

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" />

      <button id="btnLogin" class="btn">Sign in</button>
      <div id="loginMsg" class="msg"></div>
    </section>


    <!-- REGISTER VIEW (PATIENT) -->
    <section id="view-register" class="view">
      <div class="row">
        <div>
          <label for="regName">Full Name</label>
          <input id="regName" type="text" />
        </div>
        <div>
          <label for="regGender">Gender</label>
          <select id="regGender">
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <label for="regEmail">Email</label>
      <input id="regEmail" type="email" />

      <div class="row">
        <div>
          <label for="regPassword">Password</label>
          <input id="regPassword" type="password" />
        </div>
        <div>
          <label for="regPhone">Phone (optional)</label>
          <input id="regPhone" type="text" />
        </div>
      </div>

      <button id="btnRegister" class="btn">Create patient account</button>
      <div id="registerMsg" class="msg"></div>
    </section>
  </div>



  <!-- HOSPITAL + ROLE SELECT OVERLAY -->
  <div class="overlay" id="selectOverlay" style="display:none">
    <div class="chooser">
      <h2>Select your hospital & role</h2>
      <p>Pick how you want to continue. You can be an Admin and/or Doctor in the same or different hospitals.</p>
      <div id="cardGrid" class="cards"></div>
      <div class="overlay-close" id="closeOverlay">Close</div>
    </div>
  </div>

</body>
</html>
