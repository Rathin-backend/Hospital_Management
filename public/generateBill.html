<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generate Bill</title>

  <!-- jQuery (you already use it in project) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f9fc;
      --card:#ffffff;
      --accent:#0a66c2;
      --muted:#6b7280;
      --success:#16a34a;
      --danger:#dc3545;
      --shadow: 0 6px 20px rgba(16,24,40,0.06);
      --radius:12px;
      --chip-bg:#eef2ff;
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;}

    body{margin:0;background:var(--bg);padding:28px 16px;color:#111827;}
    .container{max-width:980px;margin:0 auto;}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    h1{font-size:20px;margin:0;font-weight:700;color:#0f172a}
    .back-btn{background:transparent;border:1px solid #e6eef8;padding:8px 12px;border-radius:8px;color:var(--accent);cursor:pointer}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .col{flex:1;min-width:260px}

    .section{margin-top:12px}
    .label{font-size:13px;color:var(--muted);margin-bottom:8px;display:block}
    .consultation-box{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:10px;border:1px dashed #e6eef8;background:#fcfeff}
    .big{font-weight:700;font-size:18px;color:#0b1220}
    .price{font-weight:700;font-size:18px;color:var(--accent)}

    select, button, input{font-family:inherit}
    .select{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8;background:white}
    .services-list{margin-top:12px;min-height:48px;padding:10px;border-radius:8px;border:1px solid #eef2ff;background:#ffffff}
    .chip{display:inline-flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;background:var(--chip-bg);margin:6px;margin-right:8px;font-size:14px}
    .chip .rm{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0;margin-left:6px;font-weight:700}
    .totals{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:12px;border-radius:8px;border:1px solid #eef2ff;background:#fbfdff}
    .totals .label{font-size:14px;color:var(--muted);margin:0}
    .totals .amount{font-weight:800;font-size:20px;color:#0b1b2b}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
    .btn{padding:10px 16px;border-radius:8px;border:0;cursor:pointer;font-weight:600}
    .btn-cancel{background:transparent;border:1px solid #e6eef8;color:#374151}
    .btn-confirm{background:var(--success);color:white}
    .hint{font-size:13px;color:var(--muted);margin-top:6px}

    /* responsive */
    @media (max-width:640px){
      .top{flex-direction:column;align-items:flex-start}
      .actions{width:100%}
      .actions .btn{flex:1}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div style="display:flex;gap:12px;align-items:center;">
        <button class="back-btn" id="backBtn">← Back</button>
        <h1>Generate Bill</h1>
      </div>
      <div style="text-align:right;">
        <div style="font-size:13px;color:var(--muted)">Appointment ID</div>
        <div id="appointmentBadge" style="font-weight:700;margin-top:4px">--</div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="col">
          <div class="section">
            <label class="label">Consultation (default)</label>
            <div class="consultation-box">
              <div>
                <div class="big">Consultation Fee</div>
                <div class="hint" id="consultationName">—</div>
              </div>
              <div class="price" id="consultationPrice">₹ 0.00</div>
            </div>
          </div>

          <div class="section">
            <label class="label">Add Services</label>
            <select id="serviceSelect" class="select">
              <option value="">Select service to add</option>
            </select>
            <div class="hint">Each selected item will be added to the bill. You can add multiple services.</div>

            <div class="services-list" id="selectedServices" aria-live="polite">
              <!-- Chips will appear here -->
            </div>
          </div>
        </div>

        <div class="col" style="max-width:360px">
          <div class="section">
            <label class="label">Summary</label>
            <div style="padding:14px;border-radius:10px;border:1px solid #eef2ff;background:#fff">
              <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <div style="color:var(--muted)">Consultation</div>
                <div id="sumConsultation" style="font-weight:700">₹ 0.00</div>
              </div>
              <div id="servicesSummaryWrap" style="max-height:220px;overflow:auto;margin-bottom:12px"></div>

              <div class="totals">
                <div>
                  <div class="label">Total Amount</div>
                </div>
                <div class="amount" id="totalAmount">₹ 0.00</div>
              </div>

              <div class="actions">
                <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn btn-confirm" id="confirmBtn">Confirm & Generate</button>
              </div>
              <div class="hint" id="statusHint" style="margin-top:10px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="js/generateBill.js"></script>
</body>
</html>
