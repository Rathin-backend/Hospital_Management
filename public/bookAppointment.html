<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f8fafc; color: #2d3748; margin:0; padding:0; }
    .container { max-width: 700px; margin: 50px auto; background: white; padding:30px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.08); }
    h2 { text-align:center; margin-bottom:20px; color:#2563eb; }

    label { font-weight:500; margin-top:15px; display:block; }
    select, button { width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
    button { background:#2563eb; color:white; border:none; margin-top:20px; cursor:pointer; transition:0.2s; }
    button:hover { background:#1d4ed8; }

    .date-strip { display:flex; overflow-x:auto; gap:10px; margin-top:10px; padding-bottom:5px; }
    .date-card { min-width:80px; text-align:center; border:1px solid #ccc; border-radius:10px; padding:10px 5px; cursor:pointer; background:#f1f5f9; transition:0.2s; }
    .date-card.selected { background:#2563eb; color:white; border:none; }

    .slots-container { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .slot-card { flex:1 1 30%; min-width:100px; text-align:center; padding:8px 0; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; cursor:pointer; transition:0.2s; }
    .slot-card:hover { background:#dbeafe; }
    .slot-card.selected { background:#2563eb; color:white; border:none; }

    .message { margin-top:15px; font-weight:600; text-align:center; }
    .error { color:#e11d48; }
    .success { color:#16a34a; }
    .back-btn { background:#64748b; }
    .back-btn:hover { background:#475569; }

    ::-webkit-scrollbar { height:6px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Book Appointment</h2>
    <form id="bookForm">
      <label>Hospital</label>
      <select id="hospitalSelect" required>
        <option value="">-- Select Hospital --</option>
      </select>

      <label>Department</label>
      <select id="departmentSelect" required>
        <option value="all">All Doctors</option>
        <option value="Surgeon">Surgeon</option>
        <option value="Cardiologist">Cardiologist</option>
        <option value="ENT">ENT</option>
        <option value="Dermatologist">Dermatologist</option>
      </select>

      <label>Doctor</label>
      <select id="doctorSelect" required>
        <option value="">-- Select Doctor --</option>
      </select>

      <label>Select Date</label>
      <div class="date-strip" id="dateStrip"></div>

      <label>Available Slots</label>
      <div class="slots-container" id="slotsContainer"></div>

      <button type="submit">Book Appointment</button>
      <button type="button" class="back-btn" id="backBtn">⬅ Back to Dashboard</button>
    </form>

    <div class="message" id="responseMessage"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
  <script src="bookAppointment.js"></script>
</body>
</html>
