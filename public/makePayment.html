<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Payment</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f9fc; --card:#ffffff; --accent:#0a66c2; --muted:#6b7280; 
      --success:#16a34a; --danger:#dc3545; --shadow:0 6px 20px rgba(16,24,40,0.06); --radius:12px;
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{margin:0;background:var(--bg);padding:28px;color:#111827;}
    .container{max-width:600px;margin:0 auto;}
    h1{font-size:22px;font-weight:700;margin-bottom:16px;}
    .back-btn{background:transparent;border:1px solid #e6eef8;padding:8px 12px;border-radius:8px;color:var(--accent);cursor:pointer;margin-bottom:16px;}
    .card{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;margin-bottom:6px;font-weight:600;color:#0b1220;}
    .form-group select, .form-group input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;}
    .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:16px;}
    .btn{padding:10px 16px;border-radius:8px;border:0;cursor:pointer;font-weight:600;}
    .btn-cancel{background:transparent;border:1px solid #e6eef8;color:#374151;}
    .btn-confirm{background:var(--success);color:white;}
    .info{background:#f1f5f9;padding:12px;border-radius:8px;margin-bottom:16px;}
    .info div{margin-bottom:6px;}
  </style>
</head>
<body>
  <div class="container">
    <button class="back-btn" id="backBtn">← Back</button>
    <h1>Make Payment</h1>

    <div class="card">
      <div class="info">
        <div><strong>Billing ID:</strong> <span id="billingId">--</span></div>
        <div><strong>Patient Name:</strong> <span id="patientName">--</span></div>
        <div><strong>Patient Email:</strong> <span id="patientEmail">--</span></div>
        <div><strong>Total Amount:</strong> ₹ <span id="totalAmount">0.00</span></div>
      </div>

      <div class="form-group">
        <label for="transactionType">Transaction Type</label>
        <select id="transactionType">
          <option value="">Select Payment Method</option>
          <option value="UPI">UPI</option>
          <option value="Cash">Cash</option>
          <option value="Card">Card</option>
          <option value="NetBanking">NetBanking</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn btn-confirm" id="makePaymentBtn">Make Payment</button>
      </div>
    </div>
  </div>

  <script src="js/makePayment.js"></script>
</body>
</html>
